name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The pin is otherwise only verified when someone opens a PR, and a release
  # can ship on a week nobody does. Note GitHub disables scheduled workflows in
  # a repo with 60 days of no commit activity, and mails the owner about it.
  #
  # 07:17 UTC sits after the app's nightly cron at 04:00, so a run here reads a
  # settled release list rather than one mid-publish. Nothing fires this from
  # the app repo and nothing here bumps the pin — re-pinning is a manual ask,
  # per docs/re-pinning.md, and this job only ever reports.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test

      - run: bun run build
        env:
          # GitHub allows 60 unauthenticated API requests an hour per IP, and
          # hosted runners share addresses. Without this the release lookup in
          # the build gets rate-limited and the site silently ships the pinned
          # fallback — which builds green and is not what we want to ship.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately after the build: it guards what visitors see when the API
      # is *not* reachable, and a stale pin should be loud rather than fatal to
      # everything downstream of it.
      - run: bun run check:pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same placement, same reasoning. bun test already proves the copies are
      # self-consistent offline — that each declares the $id the site serves it
      # at; this is the half of the question that needs the app repo.
      - run: bun run check:schemas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The two shell scripts this site serves. Needs no network and no app
      # repo — it parses them with a real POSIX shell, rejects bashisms, and
      # checks that the asset install.sh looks for is the asset the pin above
      # names. `dash` is what makes the parse mean anything: ubuntu-latest has
      # it, and /bin/sh there is dash already.
      - run: bun run check:scripts

  # Scheduled and manual runs only. The PR path already ends `check` with both
  # of these, and a cron run has no reason to lint, test and build the site to
  # answer two questions about a repo it does not contain. A failure here mails
  # the owner rather than blocking anything, which is the right severity for
  # either drift: the site still builds, it just serves something stale.
  #
  # This job asks about the release pin only. The app publishes a rolling
  # `nightly` tag most mornings and the site pins nothing but its URL, so a
  # fresh nightly is not drift and must not turn this red — see the header of
  # scripts/check-pinned-release.ts for how that is kept true.
  pin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # check:pin imports src/lib/release.ts, which imports zod.
      - run: bun install --frozen-lockfile

      - run: bun run check:pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `if: always()`, because these answer about different files and a stale
      # pin says nothing about a stale schema. Without it a drifted release pin
      # would hide a drifted schema for as long as it took to fix the first.
      - run: bun run check:schemas
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
