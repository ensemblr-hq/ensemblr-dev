name: CI

# The pin is verified when someone opens a PR and at no other time. There is no
# nightly drift job: re-pinning is a manual ask per docs/re-pinning.md, so the
# person who re-pins already knows a release shipped, and a cron that only ever
# reported the same thing a day later earned nobody anything.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun test

      - run: bun run build
        env:
          # GitHub allows 60 unauthenticated API requests an hour per IP, and
          # hosted runners share addresses. Without this the release lookup in
          # the build gets rate-limited and the site silently ships the pinned
          # fallback — which builds green and is not what we want to ship.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately after the build: it guards what visitors see when the API
      # is *not* reachable, and a stale pin should be loud rather than fatal to
      # everything downstream of it.
      - run: bun run check:pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same placement, same reasoning. bun test already proves the copies are
      # self-consistent offline — that each declares the $id the site serves it
      # at; this is the half of the question that needs the app repo.
      - run: bun run check:schemas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The two shell scripts this site serves. Needs no network and no app
      # repo — it parses them with a real POSIX shell, rejects bashisms, and
      # checks that the asset install.sh looks for is the asset the pin above
      # names. `dash` is what makes the parse mean anything: ubuntu-latest has
      # it, and /bin/sh there is dash already.
      - run: bun run check:scripts
